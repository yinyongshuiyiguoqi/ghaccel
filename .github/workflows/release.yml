name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/yinyongshuiyiguoqi/ghaccel/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o ghaccel${{ matrix.ext }} ./cmd/ghaccel
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o ghaccel-gui.exe ./cmd/ghaccel-gui
          fi
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "dist/ghaccel_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" ghaccel.exe ghaccel-gui.exe README.md README.en.md LICENSE
          else
            tar -czf "dist/ghaccel_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" ghaccel README.md README.en.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ghaccel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite_files: true
